<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="アシスタント">
<title>アシスタント</title>
<style>
  :root{color-scheme:light dark;--bg:#fff;--fg:#1a1a1a;--me:#d9ecff;--ai:#f0f0f0;--accent:#c96442}
  @media(prefers-color-scheme:dark){:root{--bg:#111;--fg:#eee;--me:#1f3a56;--ai:#262626}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,sans-serif;display:flex;flex-direction:column;height:100dvh}
  header{padding:12px 16px;border-bottom:1px solid #8884;display:flex;gap:8px;align-items:center}
  header input{flex:1;min-width:0;padding:8px;border:1px solid #8886;border-radius:8px;background:transparent;color:inherit;font-size:16px}
  #log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .m{max-width:85%;padding:10px 14px;border-radius:16px;line-height:1.5;white-space:pre-wrap}
  .user{align-self:flex-end;background:var(--me)}
  .ai{align-self:flex-start;background:var(--ai)}
  .sys{align-self:center;font-size:13px;opacity:.7}
  footer{padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
  #talk{width:100%;padding:18px;font-size:18px;border:0;border-radius:14px;background:var(--accent);color:#fff}
  #talk:disabled{opacity:.5}
</style>
</head>
<body>
<header>
  <input id="key" type="password" placeholder="Claude APIキー（この端末にだけ保存）">
</header>
<div id="log"></div>
<footer><button id="talk">🎤 話す</button></footer>

<script>
const $ = id => document.getElementById(id);
const MODEL = 'claude-haiku-5-5';
let history = [];

const SYSTEM_PROMPT = 'あなたは私専用の音声アシスタントです。声で読み上げられるので、日本語で、短く自然な話し言葉で答えてください。箇条書きや記号は使わないでください。今日は' + new Date().toLocaleDateString('ja-JP', {year:'numeric',month:'long',day:'numeric',weekday:'long'}) + 'です。';

$('key').value = localStorage.getItem('key') || '';
$('key').onchange = () => localStorage.setItem('key', $('key').value.trim());

function add(cls, text){
  const d = document.createElement('div');
  d.className = 'm ' + cls;
  d.textContent = text;
  $('log').appendChild(d);
  d.scrollIntoView();
}

function speak(text){
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP';
  speechSynthesis.speak(u);
}

async function ask(text){
  const key = $('key').value.trim();
  if(!key){ add('sys','先にAPIキーを入力してください'); return; }
  add('user', text);
  history.push({role:'user', content:text});
  history = history.slice(-12);           // 直近のやり取りだけ送って節約
  $('talk').disabled = true;
  try{
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{
        'content-type':'application/json',
        'x-api-key': key,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body: JSON.stringify({model:MODEL, max_tokens:600, system:SYSTEM_PROMPT, messages:history})
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error?.message || res.status);
    const reply = data.content.filter(b=>b.type==='text').map(b=>b.text).join('');
    history.push({role:'assistant', content:reply});
    add('ai', reply);
    speak(reply);
  }catch(e){
    history.pop();
    add('sys','エラー: ' + e.message);
  }finally{
    $('talk').disabled = false;
  }
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec, listening = false;

$('talk').onclick = () => {
  if(!SR){ add('sys','このブラウザは音声認識に対応していません'); return; }
  if(listening){ rec.stop(); return; }
  // iPhoneでは、ボタン操作の中で一度読み上げを呼んでおくと、後の読み上げが許可される
  speechSynthesis.cancel();
  speechSynthesis.speak(new SpeechSynthesisUtterance(''));
  rec = new SR();
  rec.lang = 'ja-JP';
  rec.interimResults = false;
  rec.onstart = () => { listening = true; $('talk').textContent = '聞いています…（タップで停止）'; };
  rec.onend = () => { listening = false; $('talk').textContent = '🎤 話す'; };
  rec.onerror = e => add('sys','音声認識エラー: ' + e.error);
  rec.onresult = e => ask(e.results[0][0].transcript);
  rec.start();
};
</script>
</body>
</html>
